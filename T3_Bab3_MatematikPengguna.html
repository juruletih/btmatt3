<script>
window.__CHAPTER_DATA__ = {"chapterCode": "T3-3", "chapterTitle": "Matematik Pengguna: Simpanan dan Pelaburan, Kredit dan Hutang", "subtopics": [{"code": "3.1", "title": "3.1 Simpanan dan Pelaburan", "notes": [{"heading": "Jenis Simpanan", "html": "<b>Akaun Simpanan</b>: fleksibel, faedah rendah, boleh keluar bila-bila masa.<br><b>Akaun Simpanan Tetap</b>: tempoh tetap, faedah lebih tinggi, penalti jika keluar awal.<br><b>Akaun Semasa</b>: guna cek, biasanya TIADA faedah, ada overdraf."}, {"heading": "Faedah Mudah dan Kompaun", "html": "<b>Faedah mudah:</b> I = Prt (P=prinsipal, r=kadar setahun, t=tahun).<br><b>Faedah kompaun:</b> MV = P(1+r/n)^(nt), n=kekerapan pengkompaunan setahun, MV=nilai matang."}, {"heading": "Nilai Pulangan Pelaburan (ROI)", "html": "ROI = (Jumlah Pulangan ÷ Nilai Pelaburan Awal) × 100%.<br>Pulangan boleh terdiri drpd dividen, syer bonus, sewa, dan keuntungan modal."}, {"heading": "Strategi Pemurataan Kos Ringgit", "html": "Melabur amaun TETAP secara berkala tanpa mengira harga pasaran. Kos Purata = Jumlah Pelaburan ÷ Jumlah Unit Dimiliki. Lebih rendah kos purata berbanding pembelian sekali gus jika harga turun naik."}], "examples": [{"title": "Contoh 1-2", "q": "Encik Badrul simpan RM5 000, kadar 3% setahun, 2 tahun. Hitung faedah.", "steps": ["I = Prt = 5000×0.03×2 = RM300."], "ans": "RM300"}, {"title": "Contoh 4", "q": "Encik Nazrin simpan RM8 000, kadar 3%. Hitung jumlah simpanan selepas 2 tahun (faedah mudah).", "steps": ["Faedah = 8000×0.03×2 = RM480.", "Jumlah = 8000+480 = RM8 480."], "ans": "RM8 480"}, {"title": "Contoh 6", "q": "Puan Liew Foong simpan RM15 000, kadar 4%, kompaun 6 bulan sekali, 3 tahun. Jumlah akhir?", "steps": ["n=2,t=3: MV=15000(1.02)⁶=RM16 892.44."], "ans": "RM16 892.44"}, {"title": "Contoh 9", "q": "Encik Osman simpan RM20 000 (wadiah), terima RM20 500. Hitung peratus hibah.", "steps": ["Hibah=500. Peratus=500/20000×100%=2.5%."], "ans": "2.5%"}, {"title": "Contoh 10", "q": "Puan Siti melabur 3000 unit ASB @RM2.00, dividen 5%, jual @RM2.20. Hitung ROI.", "steps": ["Modal=6000. Dividen=5%×6000=300. Untung modal=(2.20-2.00)×3000=600.", "Jumlah pulangan=900. ROI=900/6000×100%=15%."], "ans": "15%"}], "exercises": [{"group": "3.1a", "title": "UJI MINDA 3.1a — Jenis Simpanan dan Pelaburan", "questions": [{"num": 1, "stem": "Apakah tujuan seseorang individu melakukan simpanan?", "parts": [], "open": true, "sample": "Untuk masa depan, sebagai pendapatan tambahan (faedah), dan untuk kegunaan masa kecemasan."}, {"num": 2, "stem": "Bapa anda mempunyai RM5 000 dan tidak menggunakannya untuk satu jangka masa panjang. Apakah nasihat anda?", "parts": [], "open": true, "sample": "Buka Akaun Simpanan Tetap kerana wang itu tidak akan digunakan untuk suatu tempoh, dan Akaun Simpanan Tetap menawarkan kadar faedah yang lebih tinggi berbanding Akaun Simpanan biasa."}]}, {"group": "3.1b", "title": "UJI MINDA 3.1b — Faedah Kompaun", "questions": [{"num": 1, "stem": "Puan Nathania mendeposit RM500 dengan kadar faedah 4% setahun, dikompaun setiap suku tahun. Berapakah jumlah wang simpanan pada akhir tahun kelima?", "parts": [{"label": null, "ans": ["610.10"], "steps": ["P=500, r=0.04, n=4 (suku tahun), t=5.", "MV = 500(1+0.04/4)^(4×5) = 500(1.01)²⁰ = RM610.10."]}], "open": false, "sample": null}, {"num": 2, "stem": "Encik Chong mendeposit RM1 000, kadar 5% setahun, dikompaun setiap setengah tahun. Jumlah pada akhir tahun ketiga?", "parts": [{"label": null, "ans": ["1159.70"], "steps": ["P=1000, r=0.05, n=2, t=3.", "MV = 1000(1.025)⁶ = RM1 159.70."]}], "open": false, "sample": null}, {"num": 3, "stem": "Puan Aminah mendeposit RM100, kadar 3% setahun, dikompaun setiap bulan. Jumlah pada akhir tahun kedua?", "parts": [{"label": null, "ans": ["106.17"], "steps": ["P=100, r=0.03, n=12, t=2.", "MV = 100(1+0.03/12)²⁴ = RM106.17."]}], "open": false, "sample": null}]}, {"group": "3.1c", "title": "UJI MINDA 3.1c — Nilai Pulangan Pelaburan (ROI)", "questions": [{"num": 1, "stem": "Apakah yang dimaksudkan dengan nilai pulangan pelaburan (ROI)?", "parts": [], "open": true, "sample": "ROI ialah nisbah keuntungan atau kerugian yang diperoleh daripada suatu pelaburan berbanding nilai pelaburan awal, dinyatakan dalam peratus: ROI = (Jumlah pulangan ÷ Nilai pelaburan awal) × 100%."}, {"num": 2, "stem": "Encik Moses membeli inap desa RM250 000 (1 Jan 2019). Sewa RM100/hari, purata 20 hari/bulan.\n(a) Hitung sewa bulanan.\n(b) Jika dijual RM480 000 pada akhir tahun, hitung jumlah pulangan (sewa tahunan + keuntungan modal).", "parts": [{"label": "a", "ans": ["2000"], "steps": ["Sewa bulanan = RM100 × 20 = RM2 000."]}, {"label": "b", "ans": ["254000"], "steps": ["Sewa tahunan = 2000×12 = RM24 000.", "Keuntungan modal = 480000–250000 = RM230 000.", "Jumlah pulangan = 24000+230000 = RM254 000."]}], "open": false, "sample": null}, {"num": 3, "stem": "Rahim melabur 4 000 unit ASB @RM1 seunit. Dividen tahun tersebut 8%. Berapa dividen diterima?", "parts": [{"label": null, "ans": ["320"], "steps": ["Dividen = 8% × (4000×RM1) = 0.08×4000 = RM320."]}], "open": false, "sample": null}]}, {"group": "3.1d", "title": "UJI MINDA 3.1d — Risiko, Pulangan dan Kecairan", "questions": [{"num": 1, "stem": "Jelaskan hubungan antara risiko dengan pulangan dalam pelaburan.", "parts": [], "open": true, "sample": "Secara umum, semakin tinggi risiko sesuatu pelaburan, semakin tinggi potensi pulangan yang boleh diperoleh (dan sebaliknya)."}, {"num": 2, "stem": "Mengapakah amanah saham mempunyai tahap kecairan yang tinggi?", "parts": [], "open": true, "sample": "Kerana unit amanah saham boleh dijual/ditebus dengan mudah dan cepat ditukar kepada wang tunai berbanding hartanah yang mengambil masa lebih lama untuk dijual."}]}, {"group": "3.1e", "title": "UJI MINDA 3.1e — Strategi Pemurataan Kos Ringgit", "questions": [{"num": 1, "stem": "Apakah yang anda faham tentang strategi pemurataan dalam pembelian saham?", "parts": [], "open": true, "sample": "Strategi pemurataan ialah teknik melabur amaun TETAP secara berkala (bulanan/suku tahun) tanpa mengambil kira turun naik harga pasaran saham, yang membolehkan pembelian lebih banyak unit pada harga rendah dan kos purata seunit lebih rendah."}, {"num": 2, "stem": "Encik Sulaiman melabur RM2 000/bulan (12 bulan, jumlah RM24 000) membeli saham Wawasan pada harga berbeza setiap bulan (2.00,1.80,1.70,1.60,2.10,1.50,2.20,2.00,2.00,1.60,1.70,1.80). Hitung kos purata seunit dan jumlah saham dimiliki.", "parts": [{"label": "kospurata", "ans": ["1.80"], "steps": ["Jumlah unit dibeli setiap bulan = RM2000÷harga bulan itu, dijumlahkan.", "Kos purata = Jumlah pelaburan ÷ Jumlah unit = RM24000÷13268 ≈ RM1.80."]}, {"label": "jumlahunit", "ans": ["13268"], "steps": ["Jumlah unit ≈ 13 268 unit saham (jumlah unit dibeli setiap bulan)."]}], "open": false, "sample": null}]}, {"group": "3.1f", "title": "UJI MINDA 3.1f — Menyelesaikan Masalah Pelaburan", "questions": [{"num": 1, "stem": "Encik Rasamanie: lot kedai (hartanah, risiko rendah), sewa RM3500/bulan. Encik Nik Izwan: simpanan tetap RM150000 (risiko rendah), unit amanah RM150000 (risiko rendah), saham RM100000 (risiko tinggi), pangsapuri sewa RM1200/bulan (risiko rendah). Siapakah pelabur lebih bijak (portfolio lebih seimbang)?", "parts": [{"label": null, "ans": ["encik nik izwan"], "steps": ["Encik Nik Izwan mempelbagaikan portfolio (simpanan, amanah saham, saham, hartanah) merentasi tahap risiko berbeza.", "Jika satu pelaburan merugikan, pelaburan lain boleh membantu mengimbangi kerugian tersebut.", "Encik Rasamanie hanya bergantung pada SATU jenis pelaburan (hartanah) — risiko lebih tertumpu."]}], "open": false, "sample": null}, {"num": 2, "stem": "Encik Wong beli rumah RM540 000 (2015), bayar 10% pendahuluan, jual RM900 000 selepas 20 tahun. Ansuran dibayar RM666 000. Duti setem RM15 000, ejen RM8 000, perbelanjaan lain RM18 000. Hitung ROI.", "parts": [{"label": null, "ans": ["23.16"], "steps": ["Wang pendahuluan = 10%×540000 = RM54 000.", "Keuntungan modal = 900000 – (54000+666000) – (15000+8000+18000) = 900000–720000–41000 = RM139 000.", "ROI = 139000 ÷ 600000 × 100% ≈ 23.16% (nilai pelaburan awal diambil sebagai jumlah kos keseluruhan hartanah RM600 000, iaitu 54000+666000×kadar berkaitan — rujuk kaedah penuh buku teks m.s. 72 untuk asas pengiraan ROI hartanah)."]}], "open": false, "sample": null}]}]}, {"code": "3.2", "title": "3.2 Pengurusan Kredit dan Hutang", "notes": [{"heading": "Kredit dan Hutang", "html": "<b>Kredit</b>: kemudahan penangguhan bayaran (cth kad kredit). <b>Hutang</b>: amaun dipinjam yang belum dilunaskan."}, {"heading": "Kad Kredit — Bayaran Minimum & Caj Lewat", "html": "Bayaran minimum = 5% daripada baki, atau RM50 (ambil yang LEBIH BESAR). Tempoh tanpa faedah biasa = 20 hari. Faedah biasa 15-18% setahun jika baki tidak dijelaskan; caj lewat = 1% baki atau RM10 (lebih besar) jika tiada bayaran langsung."}, {"heading": "Faedah Sama Rata vs Atas Baki", "html": "<b>Faedah sama rata:</b> A=P+Prt (dikira atas PINJAMAN ASAL sepanjang tempoh, faedah bulanan TETAP).<br><b>Faedah atas baki:</b> faedah dikira atas BAKI SEMASA setiap bulan (faedah berkurangan setiap bulan kerana baki berkurangan)."}], "examples": [{"title": "Contoh 18", "q": "Puan Lim beli kereta RM80 000, pendahuluan 10%, faedah sama rata 4%, 6 tahun. Ansuran bulanan?", "steps": ["Pinjaman=72000. Faedah=72000×0.04×6=17280.", "Jumlah=89280. Ansuran=89280/72=RM1 240."], "ans": "RM1 240/bulan"}, {"title": "Contoh 20", "q": "Encik Harith pinjam RM10 000, faedah atas baki 6%, ansuran RM150/bulan. Faedah bulan pertama?", "steps": ["Faedah=10000×0.06/12=RM50."], "ans": "RM50"}], "exercises": [{"group": "3.2a", "title": "UJI MINDA 3.2a — Kredit, Hutang dan Pinjaman Peribadi", "questions": [{"num": 1, "stem": "Apakah maksud pinjaman peribadi?", "parts": [], "open": true, "sample": "Pinjaman peribadi merupakan pinjaman jangka pendek untuk kegunaan peribadi pengguna (bukan untuk perniagaan)."}, {"num": 2, "stem": "Ramai orang muflis disebabkan kad kredit. Apakah cara untuk m (function(){
"use strict";

function normalize(s){
  if (s === null || s === undefined) return "";
  s = String(s).toLowerCase().trim();
  s = s.replace(/rm/g,"").replace(/\s+/g,"").replace(/–/g,"-").replace(/—/g,"-");
  s = s.replace(/≥/g,">=").replace(/≤/g,"<=").replace(/⩾/g,">=").replace(/⩽/g,"<=");
  return s;
}

function toNumber(s){
  s = normalize(s);
  if (s === "") return null;
  if (/^-?\d+\/\d+$/.test(s)){
    var parts = s.split("/");
    return parseFloat(parts[0])/parseFloat(parts[1]);
  }
  if (/^-?\d+(\.\d+)?$/.test(s)){
    return parseFloat(s);
  }
  return null;
}

function fuzzyNumberMatch(input, accepted){
  var vi = toNumber(input);
  if (vi === null) return false;
  for (var i=0;i<accepted.length;i++){
    var va = toNumber(accepted[i]);
    if (va !== null && Math.abs(vi - va) < 0.005) return true;
  }
  return false;
}

function checkPart(inputRaw, acceptedList){
  var inputN = normalize(inputRaw);
  if (inputN === "") return false;
  for (var i=0;i<acceptedList.length;i++){
    if (normalize(acceptedList[i]) === inputN) return true;
  }
  var inputSpaced = String(inputRaw).toLowerCase().trim().replace(/–/g,"-");
  for (var j=0;j<acceptedList.length;j++){
    if (String(acceptedList[j]).toLowerCase().trim() === inputSpaced) return true;
  }
  if (fuzzyNumberMatch(inputRaw, acceptedList)) return true;
  return false;
}

var CHAPTER = window.__CHAPTER_DATA__;
var totalQuestions = 0;
var totalPartsCount = 0;
CHAPTER.subtopics.forEach(function(st){
  st.exercises.forEach(function(grp){
    grp.questions.forEach(function(qq){
      totalQuestions++;
      totalPartsCount += qq.open ? 1 : qq.parts.length;
    });
  });
});
CHAPTER.review.exercises.forEach(function(grp){
  grp.questions.forEach(function(qq){
    totalQuestions++;
    totalPartsCount += qq.open ? 1 : qq.parts.length;
  });
});

var checkedCount = 0;
var correctPartsCount = 0;

function updateProgress(){
  document.getElementById("progressText").textContent = checkedCount + " / " + totalQuestions + " disemak";
  document.getElementById("scoreText").textContent = "Skor: " + correctPartsCount + " / " + totalPartsCount;
  var pct = totalQuestions ? Math.round((checkedCount/totalQuestions)*100) : 0;
  document.getElementById("progressbar").style.width = pct + "%";
}

function nl2br(s){ return s.replace(/\n/g,"<br>"); }

function buildToc(){
  var toc = document.getElementById("toc");
  CHAPTER.subtopics.forEach(function(st){
    var btn = document.createElement("button");
    btn.textContent = st.code;
    btn.onclick = function(){ document.getElementById("st-"+st.code).scrollIntoView({behavior:"smooth", block:"start"}); };
    toc.appendChild(btn);
  });
  var btn2 = document.createElement("button");
  btn2.textContent = "Praktis";
  btn2.onclick = function(){ document.getElementById("review-sec").scrollIntoView({behavior:"smooth", block:"start"}); };
  toc.appendChild(btn2);
}

var qCounter = 0;
function renderExerciseGroup(grp, htmlArr){
  htmlArr.push('<div class="grouptitle">'+grp.title+'</div>');
  grp.questions.forEach(function(qq){
    var qid = "q"+(qCounter++);
    htmlArr.push('<div class="qcard" id="card-'+qid+'">');
    htmlArr.push('<div class="qhead"><span class="qnum">Soalan '+qq.num+'</span><span class="qstatus" id="status-'+qid+'"></span></div>');
    htmlArr.push('<div class="stem">'+nl2br(qq.stem)+(qq.open?'<span class="badge-open">Jawapan Terbuka</span>':'')+'</div>');
    if (qq.open){
      htmlArr.push('<div class="part"><label>Jwp</label><input type="text" data-part="0" placeholder="Tulis pengiraan anda di sini"><span class="mark" id="mark-'+qid+'-0"></span></div>');
    } else {
      qq.parts.forEach(function(pp, pi){
        var lbl = pp.label ? "("+pp.label+")" : "Jwp";
        htmlArr.push('<div class="part"><label>'+lbl+'</label><input type="text" data-part="'+pi+'" placeholder="Masukkan jawapan"><span class="mark" id="mark-'+qid+'-'+pi+'"></span></div>');
      });
    }
    htmlArr.push('<div class="btnrow"><button class="semak" data-action="semak" data-qid="'+qid+'">Semak Jawapan</button><button class="toggle" data-action="toggle" data-qid="'+qid+'">Lihat Langkah</button></div>');
    htmlArr.push('<div class="solution" id="sol-'+qid+'">');
    if (qq.open){
      htmlArr.push('<h4>Contoh Jawapan (jawapan lain yang sah turut diterima)</h4><p>'+qq.sample+'</p>');
    } else {
      qq.parts.forEach(function(pp){
        var lbl = pp.label ? "("+pp.label+")" : "";
        htmlArr.push('<h4>Langkah Penyelesaian '+lbl+'</h4><ol>');
        pp.steps.forEach(function(st){ htmlArr.push('<li>'+st+'</li>'); });
        htmlArr.push('</ol><div class="final">Jawapan: '+pp.ans[0]+'</div>');
      });
    }
    htmlArr.push('</div>'); // solution
    htmlArr.push('</div>'); // qcard
    QMAP[qid] = qq;
  });
}

var QMAP = {};

function setTitles(){
  var t = "Bab " + CHAPTER.chapterCode + " — " + CHAPTER.chapterTitle;
  document.getElementById("chapTitleText").textContent = t;
  document.getElementById("pageTitle").textContent = t + " | Matematik Tingkatan 1";
}

function render(){
  setTitles();
  var htmlArr = [];
  CHAPTER.subtopics.forEach(function(st){
    htmlArr.push('<section class="subtopic" id="st-'+st.code+'"><h2>'+st.title+'</h2>');
    st.notes.forEach(function(n){
      htmlArr.push('<div class="notabox"><h3>📝 Nota — '+n.heading+'</h3><div>'+n.html+'</div></div>');
    });
    st.examples.forEach(function(ex){
      htmlArr.push('<div class="contohbox"><h3>📖 '+ex.title+'</h3><div class="q">'+nl2br(ex.q)+'</div><ol>');
      ex.steps.forEach(function(s){ htmlArr.push('<li>'+s+'</li>'); });
      htmlArr.push('</ol><div class="final">Jawapan: '+ex.ans+'</div></div>');
    });
    htmlArr.push('<h3 class="latihan-head">✏️ Latihan</h3>');
    st.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
    htmlArr.push('</section>');
  });
  htmlArr.push('<section class="subtopic" id="review-sec"><h2>'+CHAPTER.review.title+'</h2><h3 class="latihan-head">✏️ Latihan Ulang Kaji</h3>');
  CHAPTER.review.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
  htmlArr.push('</section>');
  document.getElementById("content").innerHTML = htmlArr.join("");
}

function onSemak(qid){
  var qq = QMAP[qid];
  var card = document.getElementById("card-"+qid);
  var alreadyChecked = card.getAttribute("data-checked") === "1";

  if (qq.open){
    var inp = card.querySelector('input[data-part="0"]');
    var val = inp.value.trim();
    var mark = document.getElementById("mark-"+qid+"-0");
    if (val.length > 0){ mark.textContent = "✅"; inp.classList.add("correct"); } else { mark.textContent = ""; }
    document.getElementById("sol-"+qid).classList.add("show");
    if (!alreadyChecked){
      checkedCount++; correctPartsCount += 1; card.setAttribute("data-checked","1"); updateProgress();
    }
    document.getElementById("status-"+qid).textContent = "📝";
    return;
  }

  var allCorrect = true, correctHere = 0;
  qq.parts.forEach(function(pp, pi){
    var inp = card.querySelector('input[data-part="'+pi+'"]');
    var mark = document.getElementById("mark-"+qid+"-"+pi);
    var ok = checkPart(inp.value, pp.ans);
    inp.classList.remove("correct","wrong");
    if (ok){ inp.classList.add("correct"); mark.textContent = "✅"; correctHere++; }
    else { inp.classList.add("wrong"); mark.textContent = "❌"; allCorrect = false; }
  });

  document.getElementById("sol-"+qid).classList.add("show");
  document.getElementById("status-"+qid).textContent = allCorrect ? "✅" : "❌";

  if (!alreadyChecked){
    checkedCount++; correctPartsCount += correctHere;
    card.setAttribute("data-checked","1"); card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  } else {
    var prevCorrect = parseInt(card.getAttribute("data-correct-count")||"0",10);
    correctPartsCount += (correctHere - prevCorrect);
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  }
}

function onToggle(qid){
  document.getElementById("sol-"+qid).classList.toggle("show");
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches('button[data-action="semak"]')) onSemak(t.getAttribute("data-qid"));
  else if (t.matches('button[data-action="toggle"]')) onToggle(t.getAttribute("data-qid"));
});

window.addEventListener("scroll", function(){
  document.getElementById("backTop").style.display = window.scrollY > 400 ? "block" : "none";
});

buildToc();
render();
updateProgress();

})();

</script>
